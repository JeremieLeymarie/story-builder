name: CI

on: [push]

jobs:
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - run: bun install

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Typescript
        run: bun run ts

      - name: Test
        run: bun run test:single

      - name: Format
        run: bun run format:check

      - name: Dead Code Detection
        run: bun run knip

  server:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mongodb-version: ['8.0']

    defaults:
      run:
        working-directory: ./server

    services:
      mongo:
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "server/.python-version"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run type check
        run: uv run mypy .

      - name: Run linter
        run: uv run ruff check

      - name: Dead Code Detection
        run: uv run vulture app

      - name: Run tests
        env:
          MONGO_URL: "mongodb://localhost:27017/testdb"
        run: uv run pytest -vv
